# crs-detect: Coraza directives (story 6.5, D-70). DETECTION ONLY: nothing here may ever block, drop, redirect or delay a request.
# The helper evaluates the request phases only and never touches the response. {{PARANOIA}} is replaced by the start flag (default 1).
SecRuleEngine DetectionOnly
SecRequestBodyAccess On
SecRequestBodyLimit 8192
SecRequestBodyInMemoryLimit 8192
SecRequestBodyLimitAction ProcessPartial
SecResponseBodyAccess Off
SecAuditEngine Off
SecDebugLogLevel 0

# Body processors by content type (same as coraza.conf-recommended; ids 200000 and up are not used by the Core Rule Set).
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "^application/json" "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQUEST_HEADERS:Content-Type "^application/[a-z0-9.-]+[+]json" "id:200002,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQUEST_HEADERS:Content-Type "^application/x-www-form-urlencoded" "id:200003,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=URLENCODED"

Include @crs-setup.conf.example
SecAction "id:900000,phase:1,pass,nolog,t:none,setvar:tx.blocking_paranoia_level={{PARANOIA}}"
Include @owasp_crs/*.conf
