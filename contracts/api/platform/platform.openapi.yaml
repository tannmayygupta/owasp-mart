        members it has and its daily invite cap (the number in force and the admin's own number for this company, null when the global setting applies). The read is audited
        (the owners' names are personal data). Only an admin whose session has proved a second factor reaches this route; anyone else gets 404 REQ-ROUTE-UNKNOWN.
      parameters:
        - name: status
          in: query
          required: false
          schema: { enum: [pending, active, rejected, suspended, deleted] }
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: The companies.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCompanyList' }
              examples:
                default:
                  value: {"items": [{"org_id": "6f1c8f0e-0a5e-4a1c-9d5a-3f2d6a8b9c01", "name": "Acme Security Ltd", "status": "active", "owner_name": "Ana Owner", "owner_email_domain": "acme.example", "created_at": "2026-10-19T09:00:00Z", "members": 2, "invite_cap": 100, "invite_cap_override": null}]}
