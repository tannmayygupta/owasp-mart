      description: |
        One decision on a company (FR-ADM-01). `reject`, `suspend`, `reinstate` and `delete` need a `reason`; its text is not copied into the audit log. The company's owner is mailed the outcome of an approval or a rejection. `delete` (WP-B) ends the company and its recruiters' access at once and releases its domain; the removal of its data follows the retention rules. A company that is not in a state
        the decision starts from (already decided) is 409; an unknown company is 404.
        Only an admin whose session has proved a second factor reaches this route; anyone else gets 404 REQ-ROUTE-UNKNOWN, the answer of a route that does not exist.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyDecisionRequest' }
      responses:
        '204':
          description: The decision is made.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '409': { $ref: '#/components/responses/AdminConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
