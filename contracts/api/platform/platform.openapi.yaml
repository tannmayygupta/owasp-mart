                  value: {"org_id": "6f1c8f0e-0a5e-4a1c-9d5a-3f2d6a8b9c01", "name": "Acme Security Ltd", "status": "active", "owner_name": "Ana Owner", "owner_email_domain": "acme.example", "created_at": "2026-10-19T09:00:00Z", "members": 2, "invite_cap": 20, "invite_cap_override": 20}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
