                    state: opened
                    company_name: Acme Security Ltd
                    title: Web security screening
                    expires_at: '2026-10-27T10:00:00Z'
                    time_limit_min: 120
                    challenge_count: 3
                    hints_mode: 'off'
                    hint_cost_pct: 0
                    writeup_required: false
                    results_visibility: after_submit
        '400': { $ref: '#/components/responses/TokenInvalid' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '409': { $ref: '#/components/responses/InviteConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Invalid' }
