          description: The request.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionRequest' }
              examples:
                learner:
                  value:
                    request_id: d-AAAAAAAAAAAAAAAA
                    kind: learner
                    status: pending
                    requested_at: '2026-10-19T10:00:00Z'
                    attempt_id: null
                    company_name: null
                    decide_by: null
                    decided_at: null
                    execute_after: '2026-10-26T10:00:00Z'
                    finished_at: null
                    can_undo: true
