        title: { type: string, minLength: 1, maxLength: 120 }
        owasp_2021:
          anyOf: [{ $ref: '#/components/schemas/Owasp' }, { type: 'null' }]
        owasp_2025: { $ref: '#/components/schemas/Owasp' }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        tier: { enum: [Easy, Medium, Hard] }
        cwe_primary: { type: string, pattern: '^CWE-[0-9]+$' }
        attack:
          type: array
          maxItems: 20
          items: { type: string, pattern: '^T[0-9]{4}(\.[0-9]{3})?$' }
    CatalogueList:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          maxItems: 11
          items: { $ref: '#/components/schemas/CatalogueSummary' }
        has_more: { type: boolean }
    AttemptSummary:
      type: object
      additionalProperties: false
      required: [attempt_id, mode, state, instance_id, created_at, deadline_at]
      properties:
        attempt_id: { $ref: '#/components/schemas/AttemptId' }
        mode: { enum: [learner, candidate] }
        state:
          description: The ten attempt states of the architecture (04 section 10.1); the same as IF-2 and IF-3.
          enum: [invited, consent, ready, running, submitted, reported, withdrawn, expired, cancelled, deleted]
        instance_id:
          anyOf: [{ $ref: '#/components/schemas/InstanceId' }, { type: 'null' }]
        created_at: { $ref: '#/components/schemas/Timestamp' }
        deadline_at:
          anyOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
    AttemptSummaryList:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AttemptSummary' }
        has_more: { type: boolean }
    InstanceSummary:
      type: object
      additionalProperties: false
      required: [instance_id, attempt_id, state, access, health, epoch, error_code]
      properties:
        instance_id: { $ref: '#/components/schemas/InstanceId' }
        attempt_id: { $ref: '#/components/schemas/AttemptId' }
        state:
          description: The ten instance states of IF-5 (identical in IF-2 and IF-3).
          enum: [requested, provisioning, starting, ready, active, idle, resetting, stopping, destroyed, failed]
        access: { enum: [open, frozen, closed] }
        health: { enum: [unknown, healthy, unhealthy] }
        epoch: { type: integer, minimum: 1 }
        error_code:
          description: An INST-* code while the state is failed, otherwise null.
          anyOf: [{ type: string, pattern: '^INST(-[A-Z]+)+$', maxLength: 60 }, { type: 'null' }]
    LiveSnapshot:
      type: object
      additionalProperties: false
      required: [server_time, attempts, instances]
      properties:
        server_time: { $ref: '#/components/schemas/Timestamp' }
        attempts:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AttemptSummary' }
        instances:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/InstanceSummary' }
    LiveTicket:
      type: object
      additionalProperties: false
      required: [ticket, expires_at]
      properties:
        ticket: { $ref: '#/components/schemas/Token' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    Problem:
      description: |
        The error body of IF-8 (contracts/errors/problem.schema.json), copied here so the fragment is
        self-contained; scripts/check_platform_contract.py fails when the two differ. RFC 9457 members
        type, title and status plus code, request_id and, for 422, field or errors. Closed.
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id]
      properties:
        type:
          description: 'urn:vulnmart:error: plus the code.'
          type: string
          pattern: '^urn:vulnmart:error:[A-Z]{2,6}(-[A-Z]+)+$'
          maxLength: 100
        title:
          description: The registry's fixed generic text for the code.
          type: string
          minLength: 1
          maxLength: 200
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, pattern: '^[A-Z]{2,6}(-[A-Z]+)+$', maxLength: 60 }
        request_id: { type: string, pattern: '^[A-Za-z0-9-]{8,64}$' }
        field:
          description: One JSON Pointer to the offending field (empty string for the whole body).
          type: string
          pattern: '^(/([^/~]|~[01])*)*$'
          maxLength: 200
        errors:
          description: 'For 422 with several problems: one entry per offending field. The detail is a fixed generic text and never repeats the submitted value.'
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [pointer, detail]
            properties:
              pointer: { type: string, pattern: '^(/([^/~]|~[01])*)*$', maxLength: 200 }
              detail: { type: string, minLength: 1, maxLength: 200 }
