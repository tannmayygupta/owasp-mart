              examples:
                default:
                  value:
                    request_id: d-AAAAAAAAAAAAAAAA
                    kind: learner
                    status: cancelled
                    requested_at: '2026-10-19T10:00:00Z'
                    attempt_id: null
                    company_name: null
                    decide_by: null
                    decided_at: null
                    execute_after: '2026-10-26T10:00:00Z'
                    finished_at: '2026-10-20T08:00:00Z'
                    can_undo: false
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
