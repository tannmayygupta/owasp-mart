                        attempt_id: a-CANDIDATEATTEMPT
                        company_name: Acme Security Ltd
                        decide_by: '2026-11-02T10:00:00Z'
                        decided_at: null
                        execute_after: null
                        finished_at: null
                        can_undo: true
