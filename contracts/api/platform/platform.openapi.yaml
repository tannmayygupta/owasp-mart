        '403': { $ref: '#/components/responses/CsrfFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DeletionConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [privacy]
      operationId: listMyDeletionRequests
      summary: My deletion requests
      description: The caller's own requests, newest first, with their status and dates (FR-PRV-08, the candidate sees the status of the request).
