        Only an admin whose session has proved a second factor reaches this route; anyone else gets 404 REQ-ROUTE-UNKNOWN, the answer of a route that does not exist.
      parameters:
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: The queue.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PendingCompanyList' }
              examples:
                default:
                  value: {"items": [{"org_id": "6f1c8f0e-0a5e-4a1c-9d5a-3f2d6a8b9c01", "name": "Acme Security Ltd", "owner_name": "Ana Owner", "owner_email_domain": "acme.example", "applied_at": "2026-10-19T09:00:00Z"}]}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/v1/admin/companies/{org_id}/decision:
    post:
      tags: [admin]
