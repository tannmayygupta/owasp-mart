  /api/v1/admin/audit:
    get:
      tags: [admin]
      operationId: listAuditLog
      summary: Read the audit log
      description: |
        The audit log in order (FR-ADM-07): entries after `after_seq`, optionally of one `action`; actor and subject are pseudonyms. Each read writes its own entry
        (`admin.audit_read`). `next_after_seq` is the cursor for the next page (null when this page was not full). Only an admin with a second factor.
      parameters:
        - { name: action, in: query, required: false, schema: { type: string, maxLength: 64, pattern: '^[a-z_]+(\.[a-z_]+)*$' } }
        - { name: after_seq, in: query, required: false, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: The entries.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntryList' }
              examples:
                default:
                  value: {"items": [{"seq": 41, "at": "2026-10-20T09:00:00Z", "actor": "p-AAAAAAAAAAAAAAAA", "action": "breakglass.opened", "subject": null, "details": {"session": "g-AAAAAAAAAAAAAAAA", "minutes": 15}}], "next_after_seq": null}
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/AdminNotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
