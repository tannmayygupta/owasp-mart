name: images

# Story L-12 (ADR 0011, ADR 0032): CI builds the images listed in infra/images.json, pushes them to GHCR by digest, merges them into a tag and writes a
# release manifest (release.json, one digest reference per image). Nothing is deployed from CI and no deployment credential exists here: a person runs
# scripts/deploy.mjs (docs/runbooks/deploy.md). The only token is the automatic GITHUB_TOKEN, with packages: write in the two push jobs only.
# A pull request builds but never pushes and never gets packages: write. No repository secret is used.
on:
  pull_request:
    paths:
      - infra/images.json
      - infra/hello/**
      - apps/**
      - contracts/mocks/**
      - scripts/images-matrix.mjs
      - scripts/images-release.mjs
      - .github/workflows/images.yml
  push:
    branches: [main]
    paths:
      - infra/images.json
      - infra/hello/**
      - apps/**
      - contracts/mocks/**
      - scripts/images-matrix.mjs
      - scripts/images-release.mjs
      - .github/workflows/images.yml
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  matrix:
    name: build matrix
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # arm64 rows only when the repository variable BUILD_ARM64 is "true" (default off: both hosts are amd64, D-41 and D-51).
      - id: m
        env:
          BUILD_ARM64: ${{ vars.BUILD_ARM64 }}
        run: echo "matrix=$(node scripts/images-matrix.mjs)" >> "$GITHUB_OUTPUT"

  # Pull requests: build only, nothing is pushed, the token is read-only.
  check:
    name: build (no push) ${{ matrix.name }} ${{ matrix.arch }}
    if: github.event_name == 'pull_request'
    needs: matrix
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image without pushing
        env:
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          PLATFORM: ${{ matrix.platform }}
        run: docker buildx build --platform "$PLATFORM" -f "$DOCKERFILE" "$CONTEXT"

  # Pushes to main and tags: build natively per platform and push by digest (no tag yet).
  build:
    name: build and push ${{ matrix.name }} ${{ matrix.arch }}
    # A manual run from a feature branch must not push: only main and tags publish.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    needs: matrix
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR with the job token
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin
      - name: Build and push by digest
        env:
          NAME: ${{ matrix.name }}
          ARCH: ${{ matrix.arch }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          docker buildx create --name vm-builder --driver docker-container --use
          docker buildx build --platform "$PLATFORM" -f "$DOCKERFILE" \
            --provenance=false --sbom=false \
            --cache-from "type=registry,ref=$REGISTRY/$repo/$NAME:buildcache-$ARCH" \
            --cache-to "type=registry,ref=$REGISTRY/$repo/$NAME:buildcache-$ARCH,mode=max" \
            --output "type=image,name=$REGISTRY/$repo/$NAME,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file meta.json "$CONTEXT"
          digest="$(node -p "require('./meta.json')['containerimage.digest']")"
          case "$digest" in sha256:*) ;; *) echo "no digest in the build metadata" >&2; exit 1;; esac
          mkdir digests
          printf '%s' "$digest" > "digests/$NAME.$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 7

  # Merge the per-platform digests into one tag per image and write the release manifest.
  publish:
    name: tag and release manifest
    # A manual run from a feature branch must not push: only main and tags publish.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    needs: [matrix, build]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # The full history, so that origin/main and the ancestry of the tagged commit are known (no credentials are kept in the clone).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A tag may be pushed on any commit of any branch: only a commit that is part of main is published (M8 of the audit).
      - name: The commit must be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "the commit $GITHUB_SHA is not an ancestor of origin/main: nothing is published" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Log in to GHCR with the job token
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin
      - name: Merge into a tag and read the digest of each merged image
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          mkdir merged
          for name in $(ls digests | sed 's/\.[a-z0-9]*$//' | sort -u); do
            refs=""
            for f in digests/"$name".*; do refs="$refs $REGISTRY/$repo/$name@$(cat "$f")"; done
            tags="-t $REGISTRY/$repo/$name:${GITHUB_SHA::12}"
            if [ "$REF_TYPE" = tag ]; then tags="$tags -t $REGISTRY/$repo/$name:$REF_NAME"; fi
            # shellcheck disable=SC2086
            docker buildx imagetools create $tags $refs
            docker buildx imagetools inspect "$REGISTRY/$repo/$name:${GITHUB_SHA::12}" --format '{{json .Manifest}}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).digest))" > "merged/$name.digest"
          done
      - name: Write the release manifest
        run: node scripts/images-release.mjs --digests merged --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --out release.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: release.json
          if-no-files-found: error
          retention-days: 90
