name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels the older run of the same pull request only; a run on main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Not in any job on purpose: scripts/e2e/contracts.e2e.test.mjs is the fresh-checkout install proof (frozen install, validators, tests from a clean copy);
# the job `scripts` and the job `installs` run the same commands on a fresh checkout on every pull request, so the file adds nothing in CI (run it by hand: pnpm run test:e2e).
jobs:
  skills:
    name: verify skills
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node scripts/verify-skills.mjs

  scripts:
    name: script tests
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
      - run: node --test "scripts/*.test.mjs"
      - run: pnpm run errors:check
      - run: pnpm run domain-events:check
      - run: pnpm run api:check
      - run: node --test "contracts/mocks/stub-instance/**/*.test.mjs"
      - run: uv run --locked --package vulnmart-api pytest -q
      - run: uv run --locked --package vulnmart-orchestrator pytest -q apps/orchestrator/tests
      - run: pnpm run contracts:check


  # D-46 (story 1.15, docs/adr/0026): the rules engine must not be weakenable by the pull request it grades. The job runs the checker, the registry rules
  # and the oasdiff pins of the BASE commit and reads the pull request head only as data (folder head/). Never pull_request_target (pwn-request risk).
  # Bootstrap: while the base commit has no trusted-mode checker (the first pull request that introduces it) the head copy runs and says so in a NOTICE.
  contract-rules:
    name: contract rules
    # Pull requests only: it compares the pull request with its base (full history needed).
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout the pull request head (data only, never executed here)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout the base commit (trusted checker, registry rules and pins)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: base/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: base/.node-version
      - name: Install the dependencies of the base commit
        working-directory: base
        run: pnpm install --frozen-lockfile
      - name: Run the contract rules from the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -f base/scripts/check-contract-rules.mjs ] && grep -q 'trusted-base-checker-v1' base/scripts/check-contract-rules.mjs; then
            node base/scripts/check-contract-rules.mjs --root head --base "$BASE_SHA" --tools base/tools/oasdiff.json
          else
            echo "::notice title=contract rules bootstrap::The base commit has no trusted-mode checker yet, so the checker of the pull request head runs. This run does not protect against a pull request that weakens the rules; review it by hand."
            node head/scripts/check-contract-rules.mjs --root head --base "$BASE_SHA" --trusted --bootstrap --tools head/tools/oasdiff.json
          fi

  # The checks that must run code of the pull request (the bundle script of package.json, Alembic and table owners with Python). No credentials are kept
  # (persist-credentials false, contents: read only, no secrets). Its verdict is the check named here; the trusted job above never runs head code.
  contract-rules-untrusted:
    name: contract rules (checks that run head code)
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout the base commit (the checker that decides)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: head/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: head/.node-version
      - name: Install the dependencies of the pull request head
        working-directory: head
        run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
      - name: Run the head-code checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -f base/scripts/check-contract-rules.mjs ] && grep -q 'trusted-base-checker-v1' base/scripts/check-contract-rules.mjs; then
            node base/scripts/check-contract-rules.mjs --root head --base "$BASE_SHA" --untrusted-only
          else
            echo "::notice title=contract rules bootstrap::The base commit has no trusted-mode checker yet, so the checker of the pull request head runs."
            node head/scripts/check-contract-rules.mjs --root head --base "$BASE_SHA" --untrusted-only
          fi
  terraform:
    name: terraform fmt and validate
    # No credentials: init downloads only the pinned provider, validate and test do not contact any cloud (the tests mock the provider).
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      TF_IMAGE: hashicorp/terraform@sha256:c7926feace05d0f7e73542842bf3945924e955a1f782cf000ccbb8d18fa42d77 # Terraform 1.16.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Run as the runner's user so nothing root-owned lands in the checkout; .terraform/ is git-ignored and the lock files are read-only here.
      - run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/infra:/infra" "$TF_IMAGE" fmt -check -recursive /infra/terraform
      # AWS (the hosts in use) and Oracle (kept as an unused option): the same four checks for each folder.
      - run: |
          for d in aws oci; do
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/infra:/infra" -w "/infra/terraform/$d" "$TF_IMAGE" init -backend=false -input=false -lockfile=readonly
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/infra:/infra" -w "/infra/terraform/$d" "$TF_IMAGE" validate
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/infra:/infra" -w "/infra/terraform/$d" "$TF_IMAGE" test
          done
      - run: git status --porcelain infra | (! grep .)

  apps:
    name: app tests
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: node --test "apps/*/test/*.test.mjs"

  exploit-runner:
    name: exploit runner
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Fail if no exploit tests are found: `node --test` exits 0 on a no-match
      # glob, which would make this job pass while testing nothing.
      - run: |
          test -n "$(find challenges/tests -name '*.test.mjs' -print -quit)" \
            || { echo 'no challenge exploit tests found'; exit 1; }
      - run: node --test "challenges/tests/**/*.test.mjs"
  installs:
    name: frozen lockfile installs
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
      - run: uv lock --check

  api:
    name: api tests
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
      - run: uv sync --frozen --package vulnmart-api
      - run: uv run --frozen --package vulnmart-api pytest apps/api

  compose:
    name: compose and hello
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # pnpm and uv are installed only because `dev.mjs doctor` (checked by dev.e2e.test.mjs) reports their versions; nothing is installed from the lockfiles here.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
      - run: docker compose -f infra/compose/compose.yaml config -q
      - run: docker compose -f infra/compose/compose.yaml --profile platform --profile web config -q
      # The API image copies packages/py-models: build it so a broken Dockerfile or .dockerignore fails here.
      - run: docker compose -f infra/compose/compose.yaml --profile platform build api
      - run: node scripts/dev.mjs hello
      - run: node scripts/dev.mjs harness
      - run: node --test scripts/e2e/harness.e2e.test.mjs
      - run: node --test scripts/e2e/dev.e2e.test.mjs
  e2e:
    name: end-to-end tests (lab, orchestrator, events)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      # The nested Python run inside orchestrator.e2e.test.mjs is switched off here: the job `scripts` already runs pytest.
      VULNMART_E2E_SKIP_NESTED_PYTEST: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.23
      - run: node --test scripts/e2e/lab.e2e.test.mjs scripts/e2e/orchestrator.e2e.test.mjs scripts/e2e/events.e2e.test.mjs
