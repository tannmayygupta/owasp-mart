# tickets.toml: every planned story of this epic in build order. tickets.py reads it.
# Incepted 2026-10-09 from the T-stream task file (docs/dev/dev3-sahil.md); one
# story per task (T-08..T-13) plus a refactor sweep. Many entries wait on
# Tanmay's lab harness/contracts and carry that as an unknown.

[[entry]]
id = 1
type = "story"
title = "Snapshot seeding mechanism"
description = "Build a seeded, deterministic snapshot in CI and a per-epic seed-data mechanism so later epics add seed data without editing shared files. The world is identical across instances; only flags/secrets differ (injected later)."
verify = "A fresh database built from the snapshot holds the deterministic seed data; the build/seed time is measured."
covers = ["FR-SHP-12"]
after = []
hitl = false
risk = "medium"
# Waits on T-06 (epic-shop-core-and-roles 3.1, the data model), which is done.

