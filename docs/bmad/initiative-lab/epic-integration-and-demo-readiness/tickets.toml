type = "story"
title = "Demo rehearsal runbook, live suite steps and submission pack list"
description = "L-30 live part and L-31. docs/runbooks/demo-19-oct.md: timeline from T-24 h, pre-flight checklist, the demo script with talk track, the failure table with the fallback switch, and the two rehearsal passes to record. scripts/live-smoke.mjs: read-only HTTP checks of the deployed URLs given by environment variables (health, version, headers), tested against a local server. docs/runbooks/submission-pack.md and scripts/check-submission-pack.mjs: the list of what the college report needs from docs (decision log, ADRs, dev-logs, traceability, changelog, evidence, runbooks, PRD, architecture) and a checker that finds missing or empty items and secret-looking content."
