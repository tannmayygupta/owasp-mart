[[entry]]
id = 7
type = "story"
title = "Live lab loop on the deployed hosts: platform receiver on vm-p, orchestrator and edge on vm-i, real certificate and DuckDNS hostname, one captured flag and a score (L-30, lab side)"
description = "The lab half of the end-to-end loop on the real hosts: the lab runtime on vm-p creates an attempt through the vm-i orchestrator over mutual TLS, the instance (stub image) is opened through the real edge and the wildcard certificate at its DuckDNS hostname from the developer's PC, the sidecar's signed events reach the vm-p receiver, a flag is submitted and the score is read, the deadline is advanced, the instance is frozen and destroyed, and nothing is left behind."
