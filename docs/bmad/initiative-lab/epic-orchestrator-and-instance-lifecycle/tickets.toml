# tickets.toml: every planned story of this epic in build order. tickets.py reads it.
# Incepted 2026-10-12 from the epic and the tasks L-13, L-14 and L-16 of docs/dev/dev1-tanmay.md; approved by the developer on 2026-10-12.
# L-13 (stories 1 to 3) is EARLY PR: branch shared-L-13 from fresh main, its own pull request. L-14 and L-16 (stories 4 to 6) go on sprint-2-tanmay.

[[entry]]
id = 1
type = "story"
title = "State machine and Docker instance host: create from a template, wait for health, inject flags, never ready early"
description = "Builds the instance state machine (numbered transitions, IF-5) and a real InstanceHost on Docker that creates an instance from a template, starts its containers, waits for health and for the flag injection marker, and never reports ready before the injection finished. Tested against real Docker locally with the harness images and against the same protocol suite as the fake host."
verify = "The protocol suite passes on the Docker host as it does on the fake; an instance is never reported ready before the injection marker exists; killing a container during start ends in a failed state, not ready."
covers = ["FR-INS-01", "FR-INS-02", "FR-INS-11"]
after = ["1.4", "1.5"]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Orchestrator service: the IF-5 API with mTLS and request signing over the host and the state machine"
description = "Builds apps/orchestrator as the real service of the IF-5 contract (create, get, list, reset, access, destroy, host capacity), with mutual TLS, signed requests, idempotency and the state report to the platform, wired to the Docker host and the state machine of story 1."
verify = "The existing contract checks and the end-to-end tests that run against the fake orchestrator also pass against this service; a request without a valid signature or certificate is refused."
covers = ["FR-INS-07"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Cold-start time and memory per instance on vm-i (spike S-4)"
description = "Scripts and a runbook for the developer to measure the cold start of an instance and the memory per instance on the real labs host, and to record the result (S-4) and the numbers the next stories use."
verify = "The measured cold-start time and memory per instance are recorded in docs/research with the real redacted output."
covers = ["FR-INS-01"]
after = [2]
hitl = true
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Reset with new flags, teardown at expiry or inactivity, timing defaults"
description = "Resets an instance with new flags, tears it down after 60 minutes idle or 4 hours in total for learners and at the end of the assessment window for candidates, with the timing defaults in one settings place (SettingsPort, faked until the platform provides it)."
verify = "A learner instance stops after 60 minutes idle or 4 hours total (clock under test); reset gives new flags and a new epoch."
covers = ["FR-INS-03", "FR-INS-04"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Reconciler: repair differences between recorded and real state (spike S-13)"
description = "A reconciler compares the recorded state with Docker and repairs differences: removes leftovers, marks lost instances, completes interrupted transitions; proven by killing the orchestrator mid-provision."
verify = "After killing the orchestrator mid-provision the reconciler removes leftovers within about a minute and the recorded state matches Docker."
covers = ["FR-INS-05"]
after = [4]
hitl = false
risk = "high"

[[entry]]
id = 6
type = "story"
title = "Concurrency, quotas through the fake QuotaPort, start failures, warm-pool decision"
description = "Starts many instances at once without manual work, enforces per-user, per-company and global quotas through QuotaPort (a fake until the platform provides it), handles start failures and decides whether a warm pool is needed from measured numbers."
verify = "Quotas are enforced against the fake port, failed starts are handled, and the measured number of concurrent instances and memory per instance are recorded."
covers = ["FR-INS-06", "FR-INS-08", "FR-INS-09"]
after = [5]
hitl = true
risk = "medium"