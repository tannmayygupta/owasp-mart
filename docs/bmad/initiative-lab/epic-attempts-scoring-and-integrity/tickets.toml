title = "Anti-cheat signals and held-capture review (L-27)"
description = "Fills what stories 6.x did not: timing-anomaly and write-up similarity detectors (integrity.py, standard library), the missing ACH-01 cap and log, and HeldCaptureReview in apps/api/ingest (named reviewer, accept or reject with a note, audited, never zeroes anyone). Reviewer: recruiter or admin of the owning organisation, no deadline that changes a score (D-92, OI-38 Proposed). Only the activity check holds; all other signals are flags (D-94, Proposed)."
