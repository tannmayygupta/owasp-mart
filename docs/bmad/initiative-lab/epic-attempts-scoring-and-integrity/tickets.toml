[[entry]]
id = 5
type = "story"
title = "Reset and withdrawal during an assessment (L-26)"
description = "Engine calls can_reset and record_reset (limit from the rules, counted only while running, milestones and clock untouched) and withdraw with undo_withdrawal (instance destroyed, attempt locked, recruiter notice event, deletion after the 7-day window, undo cancels the deletion only). Adapter additions and AttemptResetLimit in apps/api ports. Planned 2026-10-17 (D-91, Proposed)."
verify = "Three resets pass and the fourth is refused with deadline and milestones unchanged; a withdrawal destroys the instance once and schedules deletion 7 days later; an undo inside the window stops the deletion; the tick after day 7 moves it to deleted."
covers = ["FR-SES-09", "FR-SES-10"]
after = [2]
hitl = false
risk = "medium"

