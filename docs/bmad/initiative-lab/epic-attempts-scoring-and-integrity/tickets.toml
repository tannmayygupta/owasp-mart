# tickets.toml: every planned story of this epic in build order. tickets.py reads it.
# Incepted 2026-10-17 from the tasks L-22 and L-23 of docs/dev/dev1-tanmay.md (stories 1 to 3, planned in detail) and L-25 to L-28 (stories 4 to 7, listed only; each is planned when it is started). Approved on the developer's delegation (run through on recorded decisions D-80 to D-88, proposed).
# Stories 4 to 7 planned in detail 2026-10-17 on the developer's delegation (D-90 to D-94, Proposed). For the 19 Oct demo only story 4 (time beside the score) and story 5 are worth doing if time remains; 6 and 7 are not needed live.
# L-22 = stories 1 and 2, L-23 = story 3. The live-demo target of 19 Oct 2026 shapes the order: rules and scoring are pure code with local proof first.

[[entry]]
id = 1
type = "story"
title = "Attempt rules library: state machine, server clock, deadline and warning rules (pure, injectable clock)"
description = "Adds the uv workspace package packages/py-attempts (module vulnmart_attempts, standard library only, no I/O): the attempt states and the allowed transitions of architecture 04 section 10.1 without skipping, the rules copied at start (time limit, grace, warnings, freeze, reset limit), the deadline from the server clock starting at instance ready (OI-22, D-80), one attempt per invite, and pure functions that say what is due at a given instant. Table and exhaustive tests; a lost connection or a browser clock cannot change any result."
verify = "Every pair of states is tested against the transition table; deadline, grace, warnings at 15 and 5 minutes and the freeze end are computed from an injected clock; the same instant always gives the same answer; the package has no dependency."
covers = ["FR-SES-01", "FR-SES-02", "FR-SES-03", "FR-SES-06", "FR-SES-08", "FR-TIM-05"]
after = []
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "Attempt engine: start at instance ready, expiry with auto-submit, 15-minute freeze, destroy, manual submit, cancel, and the port adapter"
description = "Builds AttemptEngine on the rules of story 1 with an AttemptStore Protocol (an in-memory store and a compare-and-set version check) and an InstanceControl Protocol (freeze = IF-5 access frozen, destroy). A tick() driven by the platform's scheduler is idempotent and catches up after an outage: warnings, running to expired to submitted, access frozen, destroy after frozen_until, submitted to reported once scoring is final. Adds EngineAttemptPort in apps/api/src/vulnmart/ports (implements AttemptPort and the new start, submit and tick calls) and its conformance tests against FakeInstancePort."
verify = "With a fake clock an attempt expires exactly at its deadline, is auto-submitted, its instance goes frozen and is destroyed 15 minutes later; a tick repeated or run late gives the same result; manual submit and cancel follow the same freeze and destroy; EngineAttemptPort passes the AttemptPort protocol test of the fake."
covers = ["FR-SES-02", "FR-SES-04", "FR-SES-05", "FR-SES-06", "FR-SES-07", "FR-SES-08", "FR-TIM-05"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "Scoring engine: hiring formula, milestone credit, hint floor, held captures, learner progress, Appendix A reproduced"
description = "Adds vulnmart_attempts.scoring, a pure function from per-challenge facts (best milestone on any valid path, hint levels unlocked, held flag) and a weight table to the shown score 0 to 1000 with exact half-up rounding, per-challenge points with the floor at zero, learner stars, solved tick and no-hints badge, and the tie-break facts. Time and wrong or decoy submissions are not inputs. Adds EngineReportPort score and challenge calls in apps/api/src/vulnmart/ports. Tests reproduce every PRD Appendix A example and exhaust the milestone and hint combinations."
verify = "Every row of PRD Appendix A gives the stated result (90, 36, 84, 6, 0 and 1000 shown); a held capture is excluded and the score returns when the reviewer accepts it; changing time or wrong submissions cannot change a score; the adapter returns a ReportPort Score."
covers = ["FR-SCR-01", "FR-SCR-02", "FR-SCR-03", "FR-SCR-04", "FR-SCR-05", "FR-SCR-06", "FR-SCR-09", "FR-SCR-10"]
after = [1]
hitl = false
risk = "high"

