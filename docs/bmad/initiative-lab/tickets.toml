# tickets.toml: the epics of this initiative in build order. tickets.py reads it.

[[epic]]
id = 1
slug = "epic-lab-baseline"
title = "Lab baseline and sprint-zero contracts"
covers = []

[[epic]]
id = 2
slug = "epic-environments-and-deployment"
title = "Two Oracle VMs, certificates and deployment pipelines"
covers = []
after = [{ epic = 1, needs = "the repository skeleton, Compose profiles and CI skeleton" }]

[[epic]]
id = 3
slug = "epic-orchestrator-and-instance-lifecycle"
title = "Instances start, run, reset and clean up reliably"
covers = ["FR-INS-01", "FR-INS-02", "FR-INS-03", "FR-INS-04", "FR-INS-05", "FR-INS-06", "FR-INS-07", "FR-INS-08", "FR-INS-09", "FR-INS-11"]
after = [{ epic = 1, needs = "the instance contract v0 and the orchestrator API" }, { epic = 2, needs = "VM-I with Docker" }]

[[epic]]
id = 4
slug = "epic-isolation-and-hardening"
title = "Instances are isolated and the host is protected"
covers = []
after = [{ epic = 3, needs = "the orchestrator creating instances and networks" }]

[[epic]]
id = 5
slug = "epic-edge-gate-and-event-path"
title = "Only the owner reaches an instance, and events reach the platform"
covers = ["FR-INS-10", "FR-SES-11"]
after = [{ epic = 3, needs = "instances and networks to attach to" }, { epic = 4, needs = "per-instance networks and the host rule" }]

[[epic]]
id = 6
slug = "epic-flags-detection-and-sidecar"
