covers = ["FR-FLG-01", "FR-FLG-02", "FR-FLG-03", "FR-FLG-04", "FR-FLG-05", "FR-FLG-06", "FR-FLG-07", "FR-FLG-08", "FR-FLG-09", "FR-DET-01", "FR-DET-02", "FR-DET-03", "FR-DET-04", "FR-DET-05", "FR-DET-06", "FR-DET-07", "FR-DET-08", "FR-DET-09"]
