# tickets.toml: the epics of this initiative in build order. tickets.py reads it.

[[epic]]
id = 1
slug = "epic-platform-baseline"
title = "Platform baseline and sprint-zero contracts"
covers = []

[[epic]]
id = 2
slug = "epic-notifications-and-email"
title = "Email works and never loses a message"
covers = ["FR-NTF-01", "FR-NTF-02", "FR-NTF-03", "FR-NTF-04"]
after = [{ epic = 1, needs = "the API skeleton, outbox and Valkey from the baseline" }]

[[epic]]
id = 3
slug = "epic-accounts-and-sessions"
title = "People can register, log in and stay secure"
covers = ["FR-ACC-01", "FR-ACC-02", "FR-ACC-03", "FR-ACC-04", "FR-ACC-05", "FR-ACC-06", "FR-ACC-07", "FR-ACC-08", "FR-ACC-09", "FR-ACC-10", "FR-ACC-11"]
after = [{ epic = 2, needs = "email delivery for verification and reset links" }]

[[epic]]
id = 4
slug = "epic-privacy-audit-and-keys"
title = "Privacy, consent, audit and deletion work as promised"
covers = ["FR-PRV-01", "FR-PRV-02", "FR-PRV-03", "FR-PRV-04", "FR-PRV-05", "FR-PRV-06", "FR-PRV-07", "FR-PRV-08", "FR-PRV-09", "FR-PRV-10", "FR-PRV-11", "FR-PRV-12", "FR-PRV-13", "FR-PRV-14", "FR-PRV-15", "FR-PRV-16", "FR-PRV-17", "FR-PRV-18", "FR-PRV-19", "FR-PRV-20"]
