# tickets.toml: every planned story of this epic in build order. tickets.py reads it.
# Inception 2026-10-17: one story per task of docs/dev/dev2-akshay.md (P-09, P-10), as START-HERE.md section 5 asks. The developer
# chose "continue automatically" and the Brevo single-sender provider (OI-32 answer, 2026-10-17); neither is yet recorded in initial.md.
# Re-slice 2026-10-17 (during P-10): the in-app warnings part of P-10 (FR-NTF-04) moved to entry 3, because its data (attempt deadlines,
# the live stream, the dashboards) does not exist before P-22 to P-27. "Split, never shrink": it is a story of its own, not a stub.

[[entry]]
id = 1
type = "story"
title = "Outbox, queue worker and email provider"
description = "Writes email_outbox in the caller's transaction, relays due rows to a Dramatiq worker on Valkey with back-off retries and a daily cap, and sends through a Brevo (API) or SMTP (Mailpit) provider adapter."
verify = "An email enqueued in a transaction is delivered to Mailpit, a failing provider is retried with back-off until it succeeds or is marked failed, a restart loses nothing, and 5 rows over a cap of 2 go out over two days in order."
covers = ["FR-NTF-02", "FR-NTF-03"]
after = ["epic-platform-baseline"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Email templates"
description = "Renders the nine email types of FR-NTF-01 (verification, reset, approval outcome, invite, consent withdrawal, three deletion messages, retention warning) from one strict template registry; mail names its sender and carries only its own link."
verify = "Each type renders text and HTML in a test, is refused with a password, token or address parameter, and goes through the outbox to a provider; the single-use link is removed from the row once the mail is sent."
covers = ["FR-NTF-01"]
after = [1]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "In-app time warnings and recruiter alerts"
description = "Shows the candidate time warnings (15 and 5 minutes left, placeholders) in the attempt page and recruiter alerts through the live stream, and records each warning as an event."
verify = "A candidate with a deadline in 14 minutes sees one warning, then another at 5 minutes, each recorded once; a recruiter sees the alert on the live monitor."
covers = ["FR-NTF-04", "FR-SES-03"]
after = [2, "epic-live-updates", "epic-dashboards-and-exports"]
hitl = false
risk = "medium"
unknown = "Waits on the live hub (P-22 to P-23) and the learner and candidate dashboards (P-26); the warning source (scheduler timer or client clock from deadline_at) and who owns it between this stream and stream L are not decided."
