[project]
name = "vulnmart-orchestrator"
version = "0.0.0"
description = "VulnMart orchestrator engine (stream L): the instance state machine and the Docker instance builder. The HTTP service is story 3.2."
requires-python = "==3.14.*"
dependencies = [
    "docker==7.1.0",
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vulnmart_orchestrator"
