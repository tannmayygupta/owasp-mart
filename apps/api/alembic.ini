# Alembic: one linear history for the whole API codebase (NFR-MNT-05, architecture 07 section 7.8).
# Run it as the owner role: VULNMART_MIGRATE_DSN (the app role of VULNMART_POSTGRES_DSN owns nothing and cannot migrate).
#   alembic -c apps/api/alembic.ini upgrade head          (from the repository root)
# In Compose the one-shot `migrate` service runs it before the API starts.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# no sqlalchemy.url here: migrations/env.py reads it from the environment, so no address or password is in a file

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
