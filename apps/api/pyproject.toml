[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[project]
name = "vulnmart-api"
version = "0.0.0"
description = "VulnMart platform API package (IF-9 ports only for now: the InstanceHost protocol, its fake and its HTTP client)"
requires-python = "==3.14.*"
dependencies = []

[tool.uv.build-backend]
module-name = "vulnmart"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "openapi-spec-validator==0.9.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
]
