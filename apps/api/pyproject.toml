[project]
name = "vulnmart-api"
version = "0.0.0"
description = "VulnMart platform API package: the kernel and platform API (stream P: settings, database and organisation scope, observability, health, error answers), the IF-9 ports and their fakes, and the InstanceHost client (stream L)"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.6",
    "valkey==6.1.1",
    "dramatiq[redis]==2.2.1",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "pydantic-settings==2.15.0",
    "jsonschema==4.26.0",
    "vulnmart-models",
    "vulnmart-attempts",
    "cryptography==50.0.2",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "jsonschema==4.26.0",
    "openapi-spec-validator==0.9.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
]

[tool.uv.sources]
vulnmart-models = { workspace = true }
vulnmart-attempts = { workspace = true }

[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vulnmart"
