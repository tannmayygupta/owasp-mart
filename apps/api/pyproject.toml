[project]
name = "vulnmart-api"
version = "0.0.0"
description = "VulnMart platform API (stream P). Tracer bullet: one health endpoint."
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.6",
    "valkey==6.1.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",
]

[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "vulnmart"
