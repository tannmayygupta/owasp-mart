[project]
name = "vulnmart-api"
version = "0.0.0"
description = "VulnMart platform API package: the platform API (stream P: health, error answers) and the IF-9 ports (stream L: the InstanceHost protocol, its fake and its HTTP client)"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.6",
    "valkey==6.1.1",
    "vulnmart-models",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "jsonschema==4.26.0",
    "openapi-spec-validator==0.9.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
]

[tool.uv.sources]
vulnmart-models = { workspace = true }

[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vulnmart"
