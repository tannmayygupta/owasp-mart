# uv workspace root (Python side). Members: apps/api, apps/orchestrator (stream L engine) and packages/py-models (generated contract models).
# The one pytest setting lives here (not in apps/api), so `pytest` runs the same from the root and through uv.
[project]
name = "vulnmart"
version = "0.0.0"
description = "VulnMart monorepo root (no application code yet)"
requires-python = "==3.14.*"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/orchestrator", "packages/py-attempts", "packages/py-models"]

# Plain `pytest` from the repository root runs the platform API tests only (the BMAD skills tests are not ours).
[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = "-ra"
