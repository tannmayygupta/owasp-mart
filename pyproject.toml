# uv workspace root (Python side). Member: apps/api. Stream P adds packages/py-models later.
# The one pytest setting lives here (not in apps/api), so `pytest` runs the same from the root and through uv.
[project]
name = "vulnmart"
version = "0.0.0"
description = "VulnMart monorepo root (no application code yet)"
requires-python = "==3.14.*"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

# Plain `pytest` from the repository root runs the platform API tests only (the BMAD skill tests are not ours).
[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = "-ra"
