# VulnMart challenge catalogue (IF-7 v0.1). Status: complete (T-30).
# Tags/CWE/ATT&CK from docs/design/challenge-specs.md; brief never contains a flag.
schema_version: "0.1"
key: c03
title: Injection
status: complete
owasp:
  "2021": A03
  "2025": A05
cwe:
  primary: CWE-89
  related:
    - CWE-79
attack:
  - T1190
  - T1059.007
difficulty: 3
tier: Medium
flag:
  placement: catalogue-store
  delivery: catalogue
start_state: "Part A needs no account: use the product search. Part B needs a customer: sign in as player.customer@vulnmart.test with the password player-customer-demo-b2, open Support and send a ticket, then watch the Listener page (/lab/listener). A support agent opens your ticket a few seconds later in a browser that runs scripts."
milestones:
  m1:
    summary: the player found a weakness in product search or stored ticket markup
    signal: "part A: shop.catalog_query_error (a SQL error from search) or proxy.crs_match; part B: shop.ticket_markup_stored"
  m2:
    summary: the player exploited the SQL injection or ran stored XSS in the support bot
    signal: "part A: the search response holds the ops-note marker or the flag; part B: collector.hit with bot_tagged = true"
  m3:
    summary: flag captured
    signal: "part A: proxy.flag_seen (C03A) on the search route; part B: collector.hit with a valid token for C03B"
hints:
  - level: 1
    text: >-
      Part A: what happens when your search text contains a single quote? Part B: how does the agent screen show your
      message? The Listener page tells you where the agent's browser can send things.
  - level: 2
    text: >-
      Part A: your text ends up inside a database query; UNION can add rows from another table. Part B: text may be
      shown as page code, and the code runs in the agent's browser a few seconds after you send the ticket.
  - level: 3
    text: >-
      Part A: the query has four columns; read a table of merchandising notes. Part B: put a small script in a ticket
      message (an image with an onerror handler is enough) that fetches /staff/api/agent-profile and sends the answer
      to the collector address on the Listener page, for example by setting the src of a new Image.
exploit_test: challenges/tests/c03
fixed_build: challenges/fixed/c03
brief: >-
  Two injection flaws: a product search built by string concatenation (SQLi) and a support ticket message shown
  unescaped (stored XSS).
write_up:
  vulnerable: String-concatenated SQL; an unescaped render of stored user markup.
  fix: Parameterised queries (+ allow-listed sort, least-privilege account, generic errors); HTML-escape all user content.
decoys: []
