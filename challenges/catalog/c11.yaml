fixed_build: challenges/fixed/c11
brief: The KYC verify call is wrapped in a catch that returns "verified" on any error, so a crash auto-approves a store.
write_up:
  vulnerable: A generic catch that returns success on any provider error (fail open).
  fix: >-
    Fail closed (reject or queue for manual review), strict input validation before the call, narrow exception types,
    one global handler, generic user errors, alert on provider errors.
decoys:
  - "at rest, never beside the real flag, a decoy flag-shaped value is planted per instance in the shop sentinel table under a key no route reads (decoy_placement shop-db)"
