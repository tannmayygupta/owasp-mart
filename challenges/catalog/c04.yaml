hints:
  - level: 1
    text: Refund your delivered order. Then look at what the shop says is still refundable.
  - level: 2
    text: The instant-refund rule looks at each request alone. Does anything add the requests up?
  - level: 3
    text: Try two small refunds on the same order, each below the instant limit, and compare the total refunded with what you paid.
exploit_test: challenges/tests/c04
fixed_build: challenges/fixed/c04
brief: >-
  A "quick refund" feature checks each request against a limit but never the running total, so repeated refunds exceed
  the amount paid.
write_up:
  vulnerable: A second refund feature written without the shared refundable-balance invariant.
  fix: >-
    One assertRefundable on every path, a per-order refundable balance enforced in a transaction, a count cap,
    idempotency keys, an abuse-case review.
