flag:
  placement: sentinel-table
  delivery: sentinel
start_state: "Sign in as the customer player.customer@vulnmart.test with the password player-customer-demo-b2, put something in the cart and go as far as the Pay step."
milestones:
  m1:
    summary: the player posted their own payment event to the webhook
    signal: webhook.received with source = non_gateway that names an order (order_id is not unknown); the call did not come from the gateway
  m2:
    summary: an unsigned event was accepted and the order turned paid
    signal: order.paid with verified = false and via = webhook (only posted after the webhook accepted the event, so accepted = true is implied)
  m3:
    summary: flag captured
    signal: proxy.flag_seen on the webhook response or the order page
hints:
  - level: 1
    text: Who tells the shop that a payment succeeded? Is it the customer's browser?
  - level: 2
    text: Find the endpoint the payment provider calls and check what it demands from the caller.
  - level: 3
    text: Replay the provider message yourself, and look for a header that changes how strictly it is checked.
exploit_test: challenges/tests/c08
fixed_build: challenges/fixed/c08
brief: >-
  The payment webhook skips signature verification for sandbox-mode requests, so an unsigned event can mark an order
  paid.
write_up:
  vulnerable: A test-mode signature bypass left in production config.
  fix: >-
    Always verify the HMAC (constant-time, timestamp window, event-id idempotency), remove the bypass, confirm payment
    with the provider API.
decoys:
  - "at rest, never beside the real flag, a decoy flag-shaped value is planted per instance in the shop sentinel table under a key no route reads (decoy_placement shop-db)"
