brief: >-
  "Import image from URL" screens the address with a string blocklist; a variant form reaches the internal metadata
  service.
write_up:
  vulnerable: A string blocklist of a few literal addresses.
  fix: >-
    An allow-list of image hosts, resolve DNS then check the final IP against private ranges, re-check after redirects,
    deny internal ranges at the network layer, token-based metadata, generic errors, do not return bodies.
