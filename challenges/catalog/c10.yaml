  placement: file-mock-services
  delivery: file
start_state: "Sign in as the seller owner owner.harbor@vulnmart.test with the password vulnmart-seed-demo (Harbor Crafts) and open the product editor's \"Import image from URL\"."
milestones:
  m1:
    summary: the player pointed the image importer at an internal-looking address
    signal: importer.fetch_attempt with url_class in loopback, private, link_local, internal_name and blocked = false (the address filter let an internal address through)
  m2:
    summary: the importer reached the internal metadata service
    signal: meta.request_served with ua_class = importer (the importer reached an internal service)
  m3:
    summary: flag captured
    signal: meta.request_served path /latest/user-data, ua_class = importer, plus proxy.flag_seen on the importer response
hints:
  - level: 1
    text: The shop is making a web request for you. From where is that request sent?
  - level: 2
    text: The shop tries to stop you from reaching itself. Is it checking text, or where the address really goes?
  - level: 3
    text: Cloud servers often keep a private info service at a fixed address. Ask the importer to fetch its startup data.
exploit_test: challenges/tests/c10
fixed_build: challenges/fixed/c10
brief: >-
  "Import image from URL" screens the address with a string blocklist; a variant form reaches the internal metadata
  service.
write_up:
  vulnerable: A string blocklist of a few literal addresses.
  fix: >-
    An allow-list of image hosts, resolve DNS then check the final IP against private ranges, re-check after redirects,
    deny internal ranges at the network layer, token-based metadata, generic errors, do not return bodies.
decoys:
  - "at rest, never beside the real flag, a decoy flag-shaped value is planted per instance in the shop sentinel table under a key no route reads (decoy_placement shop-db)"
  - "also a decoy file beside the placement file in the volume only that service mounts (decoy_placement service-file)"
