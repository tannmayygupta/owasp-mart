brief: >-
  The product-import merge is a naive recursive merge that lets a __proto__ key pollute the prototype (contained in a
  per-job process).
write_up:
  vulnerable: A recursive deep-merge with no dangerous-key filter (prototype pollution).
  fix: >-
    The safe merge that drops __proto__/constructor/prototype and bounds depth; freeze or null-prototype the target;
    keep the import in a sandboxed, network-less per-job process.
