global
    log stdout format raw daemon info
    pidfile /run/haproxy.pid
    maxconn 200
defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout http-request 10s
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout tunnel 10m
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
backend dockerbackend
    server dockersocket /var/run/docker.sock
frontend dockerfrontend
    bind [::]:2375 v4v6
    acl is_get method GET
    acl is_post method POST
    acl is_delete method DELETE
    acl name_vm url_param(name) -m beg vm-
    acl path_ping path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/(_ping|version)$
    acl path_c_list path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/containers/json$
    acl path_c_inspect path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/containers/[a-zA-Z0-9_-][a-zA-Z0-9_.-]*/json$
    acl path_c_create path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/containers/create$
    acl path_c_start path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/containers/vm-[a-zA-Z0-9_.-]+/(start|attach)$
    acl path_c_remove path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/containers/vm-[a-zA-Z0-9_.-]+$
    acl path_n_list path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/networks$
    acl path_n_create path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/networks/create$
    acl path_n_inspect path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/networks/[a-zA-Z0-9_-][a-zA-Z0-9_.-]*$
    acl path_n_remove path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/networks/vm-[a-zA-Z0-9_.-]+$
    acl path_n_connect path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/networks/vm-[a-zA-Z0-9_.-]+/connect$
    acl path_n_disconnect path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/networks/vm-[a-zA-Z0-9_.-]+/disconnect$
    acl path_v_list path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/volumes$
    acl path_v_create path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/volumes/create$
    acl path_v_inspect path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/volumes/[a-zA-Z0-9_-][a-zA-Z0-9_.-]*$
    acl path_v_remove path,url_dec -m reg ^(/v[0-9]+\.[0-9]+)?/volumes/vm-[a-zA-Z0-9_.-]+$
    http-request allow if is_get path_ping
    http-request allow if is_get path_c_list
    http-request allow if is_get path_c_inspect
    http-request allow if is_post path_c_create name_vm
    http-request allow if is_post path_c_start
    http-request allow if is_delete path_c_remove
    http-request allow if is_get path_n_list
    http-request allow if is_post path_n_create
    http-request allow if is_get path_n_inspect
    http-request allow if is_delete path_n_remove
    http-request allow if is_post path_n_connect
    http-request allow if is_post path_n_disconnect
    http-request allow if is_get path_v_list
    http-request allow if is_post path_v_create
    http-request allow if is_get path_v_inspect
    http-request allow if is_delete path_v_remove
    http-request deny
    default_backend dockerbackend
