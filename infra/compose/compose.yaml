# VulnMart Compose project (architecture 07, section 6).
# Start services with: node scripts/dev.mjs up <profile...>   (never call this file by hand in docs)
#
# Profiles (platform and web got their first services in story P-01; the rest are filled later):
#   platform  Postgres, Valkey, Mailpit, API, ingest, live, worker, scheduler, Caddy   (stream P, with L)
#   web       Next.js dev server, source mounted; start it with platform                (stream P)
#   lab       orchestrator, socket proxy, edge, gate, instance images                  (stream L)
#   mocks     Prism, fake orchestrator, fake ingest, stub shop                         (streams L and P)
# Profile `hello` below is the tracer bullet used by `node scripts/dev.mjs hello`.
name: vulnmart

services:
  hello:
    profiles: ["hello"]
    # busybox 1.37.0 (musl); tag plus multi-arch index digest, checked on 2026-10-08.
    image: busybox:1.37.0-musl@sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092
    container_name: vulnmart-hello
    user: "65532:65532"
    read_only: true
    mem_limit: 64m
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:18080:8080"
    command:
      - sh
      - -c
      - echo hello > /tmp/index.html && exec httpd -f -p 8080 -h /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 1s
    restart: "no"

  # ---- Platform profile (story P-01, stream P): Postgres, Valkey, Mailpit, API --------------------
  # Local development only. Postgres and Valkey are NOT published to the host: only the API and the
  # Mailpit page are, on 127.0.0.1. The database password below is a fixed development value (the
  # database is reachable only inside this Compose network); production secrets never come from here.
  # Two roles (story P-06, ADR 0014): `vulnmart` owns the tables and runs the migrations (VULNMART_DEV_DB_PASSWORD);
  # `vulnmart_app` is the API's role, without ownership or BYPASSRLS (VULNMART_DEV_APP_DB_PASSWORD), created by
  # postgres/initdb/10-app-role.sql. Postgres applies both only when its data volume is first created: after a
  # change, or on a volume made before story P-06, reset the volume (docker volume rm vulnmart_pg-data).
  # Images are pinned by digest, captured with `docker buildx imagetools inspect` on 2026-10-11.

  postgres:
    profiles: ["platform"]
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    container_name: vulnmart-postgres
    user: "999:999"
    read_only: true
    environment:
      POSTGRES_USER: vulnmart
      POSTGRES_DB: vulnmart
      POSTGRES_PASSWORD: ${VULNMART_DEV_DB_PASSWORD:-vulnmart-dev-only-not-a-secret}
      VULNMART_APP_DB_PASSWORD: ${VULNMART_DEV_APP_DB_PASSWORD:-vulnmart-app-dev-only-not-a-secret}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=999,gid=999
      - /var/run/postgresql:rw,noexec,nosuid,size=1m,uid=999,gid=999
    volumes:
      # PostgreSQL 18 images keep the cluster under /var/lib/postgresql/18/docker; mount the parent.
      - pg-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnmart -d vulnmart"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

  valkey:
    profiles: ["platform"]
    image: valkey/valkey:9.0.6-alpine3.24@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989
    container_name: vulnmart-valkey
    user: "65532:65532"
    read_only: true
    # No persistence in development: nothing is written to disk.
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    tmpfs:
      - /data:rw,noexec,nosuid,size=8m,uid=65532,gid=65532
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 1s
    restart: "no"

  mailpit:
    profiles: ["platform"]
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    container_name: vulnmart-mailpit
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    # Mailpit keeps its message store in a temporary SQLite file under /tmp: give it a small memory-backed /tmp.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 1s
    restart: "no"

  # One-shot: brings the schema to the single Alembic head as the owner role, then exits; the API starts after it.
  migrate:
    profiles: ["platform"]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        VULNMART_VERSION: ${VULNMART_VERSION:-0.0.0-dev}
        VULNMART_COMMIT: ${VULNMART_COMMIT:-unknown}
    image: vulnmart-api:local
    container_name: vulnmart-migrate
    read_only: true
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment:
      VULNMART_MIGRATE_DSN: postgresql://vulnmart:${VULNMART_DEV_DB_PASSWORD:-vulnmart-dev-only-not-a-secret}@postgres:5432/vulnmart
      VULNMART_APP_ROLE: vulnmart_app
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,uid=65532,gid=65532
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["platform"]
    # Build context is the repository root (the uv workspace lockfile lives there).
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        VULNMART_VERSION: ${VULNMART_VERSION:-0.0.0-dev}
        VULNMART_COMMIT: ${VULNMART_COMMIT:-unknown}
    image: vulnmart-api:local
    container_name: vulnmart-api
    read_only: true
    environment:
      VULNMART_POSTGRES_DSN: postgresql://vulnmart_app:${VULNMART_DEV_APP_DB_PASSWORD:-vulnmart-app-dev-only-not-a-secret}@postgres:5432/vulnmart
      VULNMART_VALKEY_URL: valkey://valkey:6379/0
      VULNMART_SERVICE: api
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,uid=65532,gid=65532
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: "no"

  # ---- Web profile (story P-01, stream P): the Next.js dev server ---------------------------------
  # Start it together with the platform profile: node scripts/dev.mjs up platform web
  # The source is bind-mounted for hot reload; node_modules and .next stay in named volumes because
  # bind mounts across Windows and Linux are slow (architecture 07, section 6). File watching polls.
  web:
    profiles: ["web"]
    build:
      context: ../../apps/web
    image: vulnmart-web:local
    container_name: vulnmart-web
    read_only: true
    environment:
      API_ORIGIN: http://api:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 512
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532
    volumes:
      - ../../apps/web:/app
      - web-node-modules:/app/node_modules
      - web-next:/app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 15s
      retries: 40
      start_period: 30s
    restart: "no"

volumes:
  pg-data:
  web-node-modules:
  web-next:
